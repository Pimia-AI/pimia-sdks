# Release: se dispara SOLO con un tag `v*` (nunca en push de ramas ni PRs).
#
# Con un tag y tras pasar build+tests de los dos SDKs:
#   1. publica @pimia/sdk en npm;
#   2. publica @pimia/design-tokens en npm (el starter lo importa: dejarlo
#      fuera obliga a clonar el monorepo, que es la fricción que la
#      publicación viene a quitar);
#   3. rehace el split de php/ y lo empuja con su tag al espejo
#      Pimia-AI/pimia-php, que es de donde Packagist sirve pimia/pimia-php.
#
# Secrets que hacen falta (sin ellos el job correspondiente falla, a
# propósito, en vez de publicar a medias):
#   NPM_TOKEN       — granular, read+write limitado al scope @pimia.
#   SPLIT_PUSH_KEY  — clave PRIVADA de una deploy key con escritura sobre
#                     Pimia-AI/pimia-php; el GITHUB_TOKEN por defecto solo
#                     alcanza a ESTE repo. Deploy key y no PAT: no caduca, no
#                     va atada a una persona y no la puede bloquear la política
#                     de PATs de la org.
#
# El alta en packagist.org es manual y de una sola vez (apuntando al espejo,
# no a este repo: Composer exige el composer.json en la raíz). A partir de
# ahí, la GitHub App de Packagist recoge cada tag que empuje el job de split.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Misma matriz que ci.yml: Node 18 fuera (sin globalThis.crypto, EOL).
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - name: Compilar (tsc estricto)
        run: npm run build

      - name: Tests
        run: npm test

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --no-progress

      - name: composer validate
        run: composer validate --strict

      - name: Tests
        run: vendor/bin/phpunit --colors=never

  publish-npm:
    name: Publicar @pimia/sdk en npm
    runs-on: ubuntu-latest
    # Solo desde el repo canónico: un fork con un tag v* no debe ni intentarlo.
    if: github.repository == 'Pimia-AI/pimia-sdks'
    needs: [typescript, php]
    permissions:
      contents: read
      # Lo exige `npm publish --provenance`.
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          # setup-node escribe el .npmrc que lee NODE_AUTH_TOKEN en el publish.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # El tag manda: si v0.2.0 apunta a un commit cuyo package.json dice
      # 0.1.0, mejor fallar aquí que publicar una versión que no es.
      - name: El tag y package.json deben coincidir
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::El tag v$TAG_VERSION no coincide con package.json ($PKG_VERSION)."
            exit 1
          fi

      # prepublishOnly compila (npm run build); el paquete sube desde dist/.
      # --provenance firma la procedencia del tarball con el OIDC de Actions:
      # exige repo público (lo es desde 2026-08-01) y `id-token: write`.
      - name: Publicar
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-design-tokens:
    name: Publicar @pimia/design-tokens en npm
    runs-on: ubuntu-latest
    if: github.repository == 'Pimia-AI/pimia-sdks'
    needs: [typescript, php]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: design-tokens
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --no-package-lock

      - name: El tag y package.json deben coincidir
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::El tag v$TAG_VERSION no coincide con package.json ($PKG_VERSION)."
            exit 1
          fi

      - name: Publicar
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Packagist sirve el paquete desde `Pimia-AI/pimia-php`, un espejo de SOLO
  # LECTURA, porque Composer exige el composer.json en la RAÍZ del repo y aquí
  # vive en php/. Este job rehace el split en cada tag y lo empuja con su tag,
  # que es lo que Packagist lee como versión.
  #
  # Empuja con una DEPLOY KEY del espejo (secret SPLIT_PUSH_KEY), no con un
  # PAT: el GITHUB_TOKEN por defecto solo alcanza a ESTE repo, y un PAT tiene
  # tres pegas que aquí costaron dos releases —caduca, va atado a una persona,
  # y si la org exige aprobar los fine-grained se queda sin permiso en
  # silencio—. Una deploy key no caduca, solo abre ESE repo y no depende de
  # ninguna cuenta. Sin el secret, el job falla en el push — a propósito, para
  # que se vea.
  split-php:
    name: Sincronizar el espejo Pimia-AI/pimia-php
    runs-on: ubuntu-latest
    if: github.repository == 'Pimia-AI/pimia-sdks'
    needs: [typescript, php]
    steps:
      # fetch-depth: 0 → el split necesita el histórico entero; con un clon
      # superficial sale un árbol sin ancestros y el push al espejo se rechaza.
      #
      # persist-credentials: false → deja de ser crítico desde que el push va
      # por SSH (la cabecera `http.…extraheader` que planta checkout solo pisa
      # a los remotos https), pero se mantiene: no hay razón para dejar el
      # GITHUB_TOKEN escrito en la config de git del runner. Fue la causa del
      # 403 `denied to github-actions[bot]` del release v0.1.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split de php/ y push al espejo con su tag
        env:
          SSH_KEY: ${{ secrets.SPLIT_PUSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Falta el secret SPLIT_PUSH_KEY (deploy key con escritura sobre Pimia-AI/pimia-php)."
            exit 1
          fi
          mkdir -p ~/.ssh
          # printf y no echo: la clave lleva saltos de línea y `echo -e` los
          # interpretaría de más en algunos shells.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/split_php
          chmod 600 ~/.ssh/split_php
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # IdentitiesOnly: que no pruebe otras claves del agente del runner y
          # se coma un «too many authentication failures».
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/split_php -o IdentitiesOnly=yes"
          git config user.name  "pimia-release-bot"
          git config user.email "release@pimia.es"
          git subtree split --prefix=php -b split/php
          REMOTE="git@github.com:Pimia-AI/pimia-php.git"
          git push --force "$REMOTE" split/php:refs/heads/main
          git push --force "$REMOTE" "split/php:refs/tags/${TAG}"
