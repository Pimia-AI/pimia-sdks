name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 NO entra: no expone `globalThis.crypto` (llegó en 19) y está
        # EOL desde 2025-04. Verificado en contenedor: 18 falla los 5 tests de
        # PKCE; 20, 22 y 24 pasan los 22.
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci

      - name: Compilar (tsc estricto)
        run: npm run build

      - name: Tests
        run: npm test

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none
          tools: composer:v2

      # Sin composer.lock a propósito (es una librería): se resuelve fresco en
      # cada run, así se detecta antes una dependencia que rompa.
      - run: composer install --no-interaction --no-progress

      - name: Lint de sintaxis
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests
        run: vendor/bin/phpunit --colors=never

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-tokens
    steps:
      - uses: actions/checkout@v7

      # Sin matriz: el paquete no tiene dependencias de runtime (solo tsc);
      # basta el Node mínimo soportado.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: design-tokens/package-lock.json

      - run: npm ci

      - name: Compilar (tsc estricto + emitir CSS)
        run: npm run build

      - name: Tests
        run: npm test

  starter:
    name: Starter kit (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # El starter consume el SDK y los design tokens por `file:`, así que hay
      # que compilarlos antes: su dist es lo que resuelve cada import.
      - name: Compilar el SDK
        run: npm ci && npm run build
        working-directory: typescript

      - name: Compilar los design tokens
        run: npm ci && npm run build
        working-directory: design-tokens

      - name: Instalar el starter
        run: npm install --no-audit --no-fund
        working-directory: examples/starter-vertical

      # `next build` typechequea el starter CONTRA el SDK: si una firma pública
      # del SDK cambia y rompe al consumidor, salta aquí y no en el partner.
      # Se compila con las DOS pieles: ambas tienen que estar siempre verdes.
      - name: Compilar el starter (piel partner)
        run: npm run build
        working-directory: examples/starter-vertical

      - name: Compilar el starter (piel pimia)
        run: NEXT_PUBLIC_THEME=pimia npm run build
        working-directory: examples/starter-vertical

  spec-sync:
    name: Tipos al día con el spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - run: npm ci
        working-directory: typescript

      # Red de seguridad de la deriva: si alguien actualiza spec/ y no
      # regenera src/api.ts (o al revés), aquí salta.
      - name: Regenerar tipos desde el spec
        run: npm run generate:types
        working-directory: typescript

      - name: El artefacto commiteado debe coincidir
        run: |
          if ! git diff --quiet -- typescript/src/api.ts; then
            echo '::error::typescript/src/api.ts no coincide con spec/pimia-api-v1.json.'
            echo 'Regenera con: cd typescript && npm run generate:types (o ./scripts/sync-spec.sh <core>)'
            git --no-pager diff --stat -- typescript/src/api.ts
            exit 1
          fi
          echo 'Los tipos están al día con el spec.'
